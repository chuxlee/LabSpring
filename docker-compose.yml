services:
  postgres-db:
    image: postgres:15-alpine
    container_name: health_checker_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: health_checker
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
